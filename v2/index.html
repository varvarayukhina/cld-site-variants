<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/splash.js?v=3"></script>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14374B">
<title>CLD — вариант 2</title>
<link rel="stylesheet" href="../fonts/montserrat.css">
<link rel="stylesheet" href="../fonts/avanti.css">
<style>
:root {
  --navy: #14374B;
  --lime: #AFC81E;
  --grey: #F0F0F0;
  --steel: #91A5AF;
  --navy-soft: #E7EFF3;
  --lime-soft: #F3F7E0;
  --ok: #2E7D32;
  --muted: #4A6474;
  --line: #D6DEE2;
  --on-navy: rgba(255, 255, 255, .86);
  --font: "Montserrat", "Segoe UI", Arial, sans-serif;
  --display: "Avanti CLD", "Montserrat", "Segoe UI", Arial, sans-serif;
  --r-card: 14px;
  --r-ctrl: 10px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--steel) var(--grey); }
body { margin: 0; background: #FFFFFF; color: var(--navy); font: 400 18px/1.55 var(--font); -webkit-tap-highlight-color: transparent; }
::selection { background: var(--lime); color: var(--navy); }
input { caret-color: var(--navy); }
a { color: inherit; }
img, svg { display: block; }
p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0; line-height: 1.15; margin: 0; text-wrap: balance; }
.num, .price { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
.top :focus-visible, .band :focus-visible, .foot :focus-visible { outline-color: var(--lime); }
[tabindex="-1"]:focus { outline: none; }
.pic svg { width: 100%; height: 100%; }
.pic rect { fill: currentColor; }
.pic .ac { fill: var(--lime); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px; border: 0; border-radius: var(--r-ctrl); font: 700 17px/1.2 var(--font); text-decoration: none; cursor: pointer; white-space: nowrap; transition: box-shadow .15s ease-out, background-color .15s ease-out, transform .1s ease-out; }
.btn svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn:active { transform: translateY(1px); }
.btn-lime { background: var(--lime); color: var(--navy); }
.btn-lime:hover { box-shadow: inset 0 0 0 2px var(--navy); }
.btn-navy { background: var(--navy); color: #FFFFFF; }
.btn-navy:hover { box-shadow: inset 0 0 0 3px var(--lime); }
.btn-line { background: #FFFFFF; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
.btn-line:hover { background: var(--navy-soft); }
.btn-ghost { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
.btn-ghost:hover { background: rgba(255, 255, 255, .35); }
.add[aria-pressed="true"] { background: #FFFFFF; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
.btn-big { width: 100%; min-height: 60px; font-size: 19px; }

/* ---------- header ---------- */
.top { background: var(--navy); color: #FFFFFF; position: relative; }
.top-in { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "logo phone cart" "search search search"; gap: 28px 28px; align-items: center; padding-top: 22px; padding-bottom: 40px; }
.logo { grid-area: logo; justify-self: start; border-radius: 6px; }
.logo img { height: 34px; width: auto; filter: brightness(0) invert(1); }
.top-phone { grid-area: phone; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; text-decoration: none; border-radius: 6px; }
.top-phone span { font-size: 15px; color: var(--on-navy); }
.top-phone b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.top-phone:hover b { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.cart { grid-area: cart; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: var(--r-ctrl); background: rgba(255, 255, 255, .09); font-weight: 600; font-size: 16px; }
.cart svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cart b { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: var(--lime); color: var(--navy); display: grid; place-items: center; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.search { grid-area: search; position: relative; z-index: 20; width: 100%; max-width: 780px; }
.s-label { display: block; margin: 0 0 16px; font-family: var(--display); font-weight: 700; font-size: 46px; line-height: 1.1; color: #FFFFFF; }
.s-label label { cursor: pointer; }
.field { position: relative; display: flex; align-items: center; background: #FFFFFF; border-radius: var(--r-card); transition: box-shadow .15s ease-out; }
.field:focus-within { box-shadow: 0 0 0 4px var(--lime); }
.field > svg { position: absolute; left: 20px; width: 28px; height: 28px; fill: none; stroke: var(--navy); stroke-width: 2.2; stroke-linecap: round; pointer-events: none; }
#q { flex: 1; min-width: 0; height: 76px; padding: 0 12px 0 62px; border: 0; border-radius: var(--r-card); background: transparent; color: var(--navy); font: 500 21px var(--font); outline: none; }
#q::placeholder { color: var(--muted); opacity: 1; }
#q::-webkit-search-cancel-button { cursor: pointer; }
.btn-find { flex: none; height: 60px; margin-right: 8px; padding: 0 30px; border: 0; border-radius: var(--r-ctrl); background: var(--lime); color: var(--navy); font: 700 19px var(--font); cursor: pointer; }
.btn-find:hover { box-shadow: inset 0 0 0 2px var(--navy); }
.btn-find:focus-visible { outline-color: var(--navy); outline-offset: -6px; }

/* suggestions */
.pop { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: #FFFFFF; color: var(--navy); border-radius: var(--r-card); box-shadow: 0 14px 36px rgba(11, 34, 48, .32); max-height: min(70vh, 520px); overflow: auto; padding: 8px; }
.pop[hidden] { display: none; }
.pop-note { padding: 10px 14px 6px; font-size: 15px; font-weight: 600; color: var(--muted); }
.pop ul { list-style: none; margin: 0; padding: 0; }
.pop li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: center; min-height: 60px; padding: 12px 14px; border-radius: var(--r-ctrl); cursor: pointer; }
.pop li:hover, .pop li[aria-selected="true"] { background: var(--navy-soft); }
.pop li[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--navy); }
.o-n { display: block; font-weight: 700; font-size: 18px; line-height: 1.3; }
.o-d { display: block; font-size: 15px; color: var(--muted); line-height: 1.4; }
.o-p { font-weight: 800; font-size: 19px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pop-empty { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px; }
.pop-empty p { font-weight: 700; font-size: 19px; }

/* brand cells in the home band */
.hero-cells { grid-area: cells; display: none; width: 236px; aspect-ratio: 1; grid-template-columns: repeat(13, 1fr); gap: 4px; align-self: end; }
.hero-cells i { border-radius: 22%; background: rgba(255, 255, 255, .07); }
.hero-cells i.w { background: #FFFFFF; }
.hero-cells i.l { background: var(--lime); }
.hero-cells i.rtr { border-top-right-radius: 100%; }
.hero-cells i.rbl { border-bottom-left-radius: 100%; }
@media (min-width: 1080px) {
  .home .top-in { grid-template-columns: minmax(0, 1fr) auto auto 236px; grid-template-areas: "logo phone cart cells" "search search search cells"; column-gap: 32px; }
  .home .hero-cells { display: grid; }
  .home .top-phone, .home .cart { align-self: start; }
  .home .logo { align-self: start; margin-top: 7px; }
}

/* compact header on inner screens */
.inner .top-in { padding-bottom: 26px; row-gap: 20px; }
.inner .s-label { margin-bottom: 8px; font: 600 16px/1.2 var(--font); color: var(--on-navy); }
.inner #q { height: 64px; font-size: 19px; }
.inner .btn-find { height: 50px; padding: 0 24px; font-size: 18px; }
@media (min-width: 1080px) {
  .inner .top-in { grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "logo search phone cart"; align-items: end; padding-bottom: 28px; }
  .inner .logo { align-self: center; margin-top: 26px; }
  .inner .search { max-width: 600px; justify-self: center; }
  .inner .top-phone, .inner .cart { align-self: center; margin-top: 26px; }
}

/* ---------- blocks ---------- */
.block { padding-top: 48px; }
.h2 { font-size: 34px; margin: 0 0 22px; }

/* six tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 22px; min-height: 196px; padding: 26px 28px; border: 0; border-radius: var(--r-card); background: var(--navy); color: #FFFFFF; font: inherit; text-align: left; text-decoration: none; cursor: pointer; transition: box-shadow .15s ease-out, transform .12s ease-out; }
.tile .pic { width: 64px; height: 64px; }
.tile-l { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1; }
.tile small { display: block; margin-top: 6px; font: 700 17px/1.2 var(--font); font-variant-numeric: tabular-nums; }
.tile:hover { box-shadow: inset 0 0 0 3px var(--lime); }
.tile:active { transform: scale(.98); }
.tile-call { background: var(--lime); color: var(--navy); }
.tile-call .pic .ac { fill: var(--navy); }
.tile-call:hover { box-shadow: inset 0 0 0 3px var(--navy); }

/* list rows */
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 40px; align-items: center; padding: 22px 18px; border-bottom: 1px solid var(--line); transition: background-color .15s ease-out; }
.row:has(.row-name[href]):hover { background: var(--grey); }
.row-name { font-weight: 700; font-size: 21px; line-height: 1.3; text-decoration: none; }
a.row-name::after { content: ""; position: absolute; inset: 0; }
a.row-name:hover { text-decoration: underline; text-underline-offset: 4px; }
.row-d { margin-top: 4px; font-size: 17px; color: var(--muted); max-width: 64ch; }
.row-meta { margin-top: 6px; font-size: 15px; color: var(--muted); }
.row-buy { position: relative; z-index: 1; display: flex; align-items: center; gap: 22px; }
.price { font-weight: 800; font-size: 24px; white-space: nowrap; }
.more { display: inline-flex; margin-top: 24px; }

/* catalog */
.cats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat { display: flex; align-items: center; gap: 20px; min-height: 100px; height: 100%; padding: 16px 20px 16px 22px; border-radius: var(--r-card); background: var(--grey); color: var(--navy); text-decoration: none; transition: background-color .15s ease-out; }
.cat:hover { background: var(--navy-soft); }
.cat .pic { width: 56px; height: 56px; flex: none; }
.cat-t { min-width: 0; }
.cat-t b { display: block; font-family: var(--display); font-size: 24px; line-height: 1.15; }
.cat-t small { display: block; margin-top: 4px; font-size: 16px; color: var(--muted); }
.chev { width: 30px; height: 30px; margin-left: auto; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* navy title band */
.band { background: var(--navy); color: #FFFFFF; }
.band-in { padding-top: 26px; padding-bottom: 48px; border-top: 1px solid rgba(255, 255, 255, .16); }
.back { display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 24px 8px 14px; border-radius: var(--r-ctrl); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); color: #FFFFFF; text-decoration: none; transition: box-shadow .15s ease-out; }
.back:hover { box-shadow: inset 0 0 0 2px var(--lime); }
.back svg { width: 28px; height: 28px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.back b { display: block; font-size: 19px; line-height: 1.2; }
.back small { display: block; font-size: 15px; line-height: 1.3; color: var(--on-navy); }
.band-h { display: flex; align-items: center; gap: 22px; margin-top: 32px; }
.band-h .pic { width: 72px; height: 72px; flex: none; color: #FFFFFF; }
.band h1 { font-size: 54px; color: #FFFFFF; }
.band-desc { max-width: 62ch; margin-top: 16px; font-size: 20px; color: var(--on-navy); }

/* checkup plate */
.cu { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 40px; align-items: end; padding: 30px 32px; margin-bottom: 48px; border-radius: var(--r-card); background: var(--lime); color: var(--navy); }
.cu h2 { font-size: 32px; }
.cu-inc { margin-top: 10px; font-size: 18px; max-width: 60ch; }
.cu-meta { margin-top: 8px; font-size: 16px; font-weight: 600; }
.cu-buy { display: flex; align-items: center; gap: 22px; }
.cu .price { font-size: 34px; }

/* empty section */
.empty { display: flex; gap: 28px; align-items: flex-start; padding: 32px; border-radius: var(--r-card); background: var(--grey); }
.empty .pic { width: 64px; height: 64px; flex: none; }
.empty h2 { font-size: 30px; }
.empty p { margin: 10px 0 20px; max-width: 56ch; }

/* card */
.card-band .band-in { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-areas: "back back" "head box"; gap: 32px 64px; align-items: start; }
.card-band .back { grid-area: back; justify-self: start; }
.card-head { grid-area: head; padding-top: 8px; }
.card-head h1 { font-size: 68px; line-height: 1.05; }
.lede { margin-top: 18px; font-size: 23px; line-height: 1.45; color: #FFFFFF; max-width: 34ch; }
.off { margin-top: 18px; font-size: 15px; color: var(--on-navy); }
.pbox { grid-area: box; padding: 28px; border-radius: var(--r-card); background: #FFFFFF; color: var(--navy); }
.pb-price { font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.pb-online { margin-top: 10px; font-size: 17px; }
.pb-online b { font-weight: 800; }
.pb-lines { margin: 20px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); }
.pb-lines div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 17px; }
.pb-lines dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pb-lines .tot { font-weight: 700; font-size: 19px; }
.pb-lines .tot dd { font-weight: 800; }
.pb-facts { list-style: none; margin: 18px 0 22px; padding: 16px 0 0; border-top: 1px solid var(--line); display: grid; gap: 10px; font-size: 17px; }
.pb-facts li { display: flex; gap: 12px; align-items: flex-start; }
.pb-facts svg { width: 22px; height: 22px; flex: none; margin-top: 2px; fill: none; stroke: var(--navy); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pbox .btn + .btn { margin-top: 10px; }
.pbox .btn-line { width: 100%; }
.card-body { max-width: 820px; padding-top: 40px; }
.draft { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px; padding: 10px 16px; border-radius: 999px; background: var(--lime-soft); font-size: 15px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(20, 55, 75, .12); }
.draft i { width: 10px; height: 10px; border-radius: 3px; background: var(--navy); flex: none; }
.acc { margin-bottom: 12px; border-radius: var(--r-card); box-shadow: inset 0 0 0 2px var(--line); transition: box-shadow .15s ease-out; }
.acc[open] { box-shadow: inset 0 0 0 2px var(--navy); }
.acc summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 76px; padding: 14px 18px 14px 24px; border-radius: var(--r-card); cursor: pointer; list-style: none; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary:hover { background: var(--grey); }
.acc[open] summary:hover { background: transparent; }
.acc h2 { font-size: 25px; }
.pm { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: var(--r-ctrl); background: var(--navy); color: #FFFFFF; }
.pm svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.pm .v { transition: opacity .15s ease-out; }
.acc[open] .pm { background: var(--lime); color: var(--navy); }
.acc[open] .pm .v { opacity: 0; }
.acc-c { padding: 0 24px 26px; max-width: 70ch; }
.acc-c p + p, .acc-c p + ul, .acc-c ul + p { margin-top: 12px; }
.acc-c h3 { font: 700 18px/1.35 var(--font); margin-top: 18px; }
.acc-c h3:first-child { margin-top: 0; }
.acc-c h3 + p { margin-top: 4px; }
.dots { list-style: none; margin: 0; padding: 0; }
.dots li { position: relative; padding-left: 28px; margin: 10px 0 0; }
.dots li:first-child { margin-top: 0; }
.dots li::before { content: ""; position: absolute; left: 0; top: .5em; width: 12px; height: 12px; border-radius: 3px; background: var(--navy); }
.dots li:nth-child(odd)::before { background: var(--lime); }
.src { list-style: none; margin: 0; padding: 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.src li + li { margin-top: 8px; }
.nodesc { padding: 26px; border-radius: var(--r-card); background: var(--grey); }
.nodesc p { margin-bottom: 18px; font-size: 19px; font-weight: 600; }
.note { display: flex; gap: 16px; align-items: center; margin-top: 28px; padding: 22px 24px; border-radius: var(--r-card); background: var(--navy-soft); font-size: 19px; font-weight: 600; }
.note svg { width: 28px; height: 28px; flex: none; fill: none; stroke: var(--navy); stroke-width: 2.2; stroke-linecap: round; }

/* points */
.pts { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.pt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 24px; align-items: center; padding: 24px 26px; border-radius: var(--r-card); background: var(--grey); }
.pt .pic { width: 52px; height: 52px; }
.pt-a { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.15; }
.pt-h { margin-top: 4px; font-size: 18px; }
.pt-h b { font-variant-numeric: tabular-nums; }
.state { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-weight: 700; font-size: 16px; white-space: nowrap; }
.state::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
.state.open { color: var(--ok); }
.state.closed { color: var(--muted); }
.pts-note { margin-top: 20px; max-width: 64ch; color: var(--muted); }

/* help band */
.help { margin-top: 72px; background: var(--lime); color: var(--navy); }
.help-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 40px; padding-top: 44px; padding-bottom: 44px; }
.help h2 { font-size: 38px; }
.help-t p { margin-top: 6px; font-size: 21px; font-weight: 500; }
.help-acts { display: flex; flex-wrap: wrap; gap: 12px; }
.help .btn { min-height: 60px; font-size: 19px; padding: 0 26px; }

/* footer */
.foot { background: var(--navy); color: #FFFFFF; }
.warn { padding: 24px 16px; text-align: center; font: 800 20px/1.35 var(--font); text-transform: uppercase; letter-spacing: .02em; border-bottom: 1px solid rgba(255, 255, 255, .16); }
.foot-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 48px; align-items: start; padding-top: 34px; padding-bottom: 44px; font-size: 15px; color: var(--on-navy); }
.foot-in img { height: 30px; width: auto; filter: brightness(0) invert(1); }
.foot-in a { color: #FFFFFF; font-weight: 800; font-size: 20px; text-decoration: none; font-variant-numeric: tabular-nums; }
.foot-in p + p { margin-top: 6px; }

/* phone bar on card */
.bar { display: none; }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bar small { font-size: 15px; color: var(--muted); }
.bar .btn { min-height: 56px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: calc(100% - 32px); width: max-content; padding: 16px 22px; border-radius: 12px; background: var(--navy); color: #FFFFFF; font-weight: 600; font-size: 17px; box-shadow: 0 10px 30px rgba(11, 34, 48, .3); opacity: 0; transform: translate(-50%, 16px); transition: opacity .2s ease-out, transform .25s cubic-bezier(.16, 1, .3, 1); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cats { grid-template-columns: 1fr; }
  .card-band .band-in { grid-template-columns: 1fr; grid-template-areas: "back" "head" "box"; gap: 24px; }
  .pbox { max-width: 560px; }
}
@media (max-width: 760px) {
  .has-bar { padding-bottom: 92px; }
  .has-bar .bar { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: #FFFFFF; box-shadow: 0 -6px 22px rgba(20, 55, 75, .16); }

  function vCheckups() {
    return { html: band({ back: "#home", label: "на главную", title: "Готовые чек-апы", desc: "Несколько анализов под одну задачу в одном заказе. Состав и цена — в каждой строке.", pic: "checkups" }) +
      '<section class="wrap block"><h2 class="sr">Список чек-апов</h2><ul class="rows">' + Object.keys(CHECKUPS).map(function (id) {
        var k = CHECKUPS[id];
        return '<li class="row"><div><b class="row-name">' + esc(k.n) + '</b><p class="row-d">' + esc(k.inc) + '</p><p class="row-meta">' + C.nAn(k.count) + ". " + daysLabel(k.days) + "</p></div>" +
          '<div class="row-buy"><b class="price">' + rub(k.p) + "</b>" + cartBtn("cu-" + id) + "</div></li>";
      }).join("") + "</ul></section>" };
  }

  function vPoints() {
    return { html: band({ back: "#home", label: "на главную", title: "Где сдать", desc: "Три пункта в Черкесске. Всего у CLD " + FACTS.points + " пунктов в КЧР, КБР и на КМВ — ближайший подскажем по телефону.", pic: "points" }) +
      '<section class="wrap block"><h2 class="sr">Пункты в Черкесске</h2><ul class="pts">' + POINTS.map(function (p) {
        var s = C.pointState(p);
        return '<li class="pt">' + pic("points") + '<div><p class="pt-a">' + esc(p.addr) + '</p><p class="pt-h">Черкесск. Часы работы: <b>' + p.open + "–" + p.close + "</b></p></div>" +
          '<span class="state ' + (s.open ? "open" : "closed") + '">' + esc(s.label.charAt(0).toUpperCase() + s.label.slice(1)) + "</span></li>";
      }).join("") + '</ul><p class="pts-note">Цены на сайте указаны для пункта на ул. Гутякулова, 20.</p></section>' };
  }

  // ---------- router ----------
  var first = true;
  function route() {
    var h = decodeURIComponent(location.hash.slice(1)) || "home", m, v, c;
    if (h === "home") v = vHome();
    else if (h === "catalog") v = vCatalog();
    else if (h === "checkups") v = vCheckups();
    else if (h === "points") v = vPoints();
    else if ((m = h.match(/^catalog-(.+)$/)) && (c = CATS.filter(function (x) { return x.id === m[1]; })[0])) { v = vSection(c); lastCat = c.id; }
    else if ((m = h.match(/^card-(.+)$/)) && A[m[1]]) v = vCard(m[1]);
    else { location.replace("#home"); return; }
    var home = v.cls === "home";
    document.body.className = (v.cls || "") + (home ? "" : " inner");
    $("#top").innerHTML = header(home);
    $("#main").innerHTML = v.html + help();
    $("#bar").innerHTML = v.bar || "";
    // desktop: the buy bar slides in once the price box has scrolled away
    if (route.io) route.io.disconnect();
    var pb = $(".pbox");
    if (pb && "IntersectionObserver" in window) { route.io = new IntersectionObserver(function (en) { document.body.classList.toggle("bar-on", !en[0].isIntersecting); }); route.io.observe(pb); }
    window.scrollTo(0, 0);
    if (!first) { var h1 = $("h1"); if (h1) h1.focus({ preventScroll: true }); }
    first = false;
  }
  window.addEventListener("hashchange", route);

  // ---------- cart & toast ----------
  var tt;
  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(tt); tt = setTimeout(function () { t.classList.remove("on"); }, 3500);
  }
  function toggle(key) {
    if (cart.has(key)) cart.delete(key); else cart.add(key);
    var on = cart.has(key);
    document.querySelectorAll('[data-add="' + CSS.escape(key) + '"]').forEach(function (b) {
      b.setAttribute("aria-pressed", on);
      b.setAttribute("aria-label", (on ? "Убрать из корзины: " : "Добавить в корзину: ") + itemName(key));
      b.innerHTML = btnInner(on);
    });
    $("#cartN").textContent = cart.size;
    toast(on ? itemName(key) + " — в корзине. Всего: " + cart.size : itemName(key) + " — убрали из корзины");
  }

  // ---------- search ----------
  var res = [], idx = -1;
  function closePop() {
    var pop = $("#pop"), q = $("#q");
    if (!pop) return;
    pop.hidden = true; pop.innerHTML = ""; idx = -1;
    q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant");
  }
  function renderPop() {
    var q = $("#q"), pop = $("#pop"), val = q.value;
    if (val.trim().length < 2) { closePop(); return; }
    res = C.search(val); idx = -1;
    var h;
    if (!res.length) {
      h = '<div class="pop-empty"><p>Не нашли? Позвоните, подскажем</p><a class="btn btn-lime" href="' + TEL + '">' + I.phone + "<span>" + PHONE + "</span></a></div>";
      $("#sr").textContent = "Ничего не нашли. Позвоните, подскажем: " + PHONE;
    } else {
      h = (res.some(function (r) { return r.fuzzy; }) ? '<p class="pop-note">Показали похожие</p>' : "") +
        '<ul role="listbox" aria-label="Найденные анализы">' + res.map(function (r, i) {
          var a = A[r.code];
          return '<li role="option" id="opt' + i + '" aria-selected="false" data-code="' + r.code + '"><span><span class="o-n">' + esc(a.n) + '</span><span class="o-d">' + esc(a.d) + '</span></span><b class="o-p">' + rub(a.p) + "</b></li>";
        }).join("") + "</ul>";
      $("#sr").textContent = "Найдено: " + C.nAn(res.length);
    }
    pop.innerHTML = h; pop.hidden = false;
    q.setAttribute("aria-expanded", "true"); q.removeAttribute("aria-activedescendant");
  }
  function mark() {
    var q = $("#q");
    document.querySelectorAll('#pop [role="option"]').forEach(function (o, i) { o.setAttribute("aria-selected", i === idx ? "true" : "false"); });
    var o = document.getElementById("opt" + idx);
    if (o) { q.setAttribute("aria-activedescendant", o.id); o.scrollIntoView({ block: "nearest" }); }
  }
  function open(code) {
    closePop();
    if (location.hash === "#card-" + code) route(); else location.hash = "#card-" + code;
  }
  function submit() {
    var q = $("#q");
    if (q.value.trim().length < 2) { q.focus(); return; }
    if ($("#pop").hidden) renderPop();
    if (res.length) open(res[idx >= 0 ? idx : 0].code);
  }

  document.addEventListener("input", function (e) { if (e.target.id === "q") renderPop(); });
  document.addEventListener("focusin", function (e) { if (e.target.id === "q" && e.target.value.trim().length >= 2 && $("#pop").hidden) renderPop(); });
  document.addEventListener("keydown", function (e) {
    if (e.target.id !== "q") return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if ($("#pop").hidden) renderPop();
      if (!res.length || $("#pop").hidden) return;
      e.preventDefault();
      idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + res.length + (idx < 0 && e.key === "ArrowUp" ? 1 : 0)) % res.length;
      mark();
    } else if (e.key === "Enter") { e.preventDefault(); submit(); }
    else if (e.key === "Escape" && !$("#pop").hidden) { e.preventDefault(); closePop(); }
  });
  document.addEventListener("focusout", function (e) {
    var s = e.target.closest && e.target.closest(".search");
    if (s && !s.contains(e.relatedTarget)) closePop();
  });
  document.addEventListener("mousedown", function (e) { if (e.target.closest('#pop [role="option"]')) e.preventDefault(); });
  document.addEventListener("click", function (e) {
    var t = e.target;
    var add = t.closest("[data-add]"); if (add) { toggle(add.dataset.add); return; }
    var stub = t.closest("[data-stub]"); if (stub) { e.preventDefault(); toast(STUB[stub.dataset.stub]); return; }
    var opt = t.closest('#pop [role="option"]'); if (opt) { open(opt.dataset.code); return; }
    if (t.closest(".btn-find")) { submit(); return; }
    var sc = t.closest("[data-scroll]");
    if (sc) {
      var el = document.getElementById(sc.dataset.scroll);
      el.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" });
      el.querySelector("h2").focus({ preventScroll: true });
    }
  });

  route();
})();
</script>
<script src="../shared/switcher.js" defer></script>
</body>
</html>
